name: Java CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/aeron.sh test
      - name: Compile and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/aeron.ps1 test
      - name: Save simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results-${{ matrix.os }}
          path: test/
